services:
  ollama:
    image: ollama/ollama:0.6.8
    container_name: ollama-rag-lab
    ports:
      - "11435:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_MAX_LOADED_MODELS=2
    restart: unless-stopped

  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.5.20
    container_name: open-webui-lab
    ports:
      - "3001:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama-rag-lab:11434
      - WEBUI_AUTH=true
      # Embeddings via Ollama: evita descargar all-MiniLM-L6-v2 desde Hugging Face
      - RAG_EMBEDDING_ENGINE=ollama
      - RAG_EMBEDDING_MODEL=nomic-embed-text
      - RAG_OLLAMA_BASE_URL=http://ollama-rag-lab:11434
    volumes:
      - open-webui_data:/app/backend/data
    depends_on:
      - ollama
    restart: unless-stopped

volumes:
  ollama_data:
  open-webui_data:
